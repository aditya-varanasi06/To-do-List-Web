<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Task Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --done: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 420px;
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #334155;
      color: white;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: black;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
    }

    li {
      background: #334155;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    li.completed {
      text-decoration: line-through;
      opacity: 0.6;
      border-left: 4px solid var(--done);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .delete {
      background: var(--danger);
      color: white;
    }

    .filters {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .filters button {
      flex: 1;
      margin: 5px;
      background: #475569;
      color: white;
    }

    .active-filter {
      background: var(--accent) !important;
      color: black !important;
    }

  </style>
</head>
<body>
  <div class="app">
    <h1>🚀 Smart Tasks</h1>

    <div class="input-group">
      <input id="taskInput" placeholder="Add a new task..." />
      <button onclick="addTask()">Add</button>
    </div>

    <div class="filters">
      <button onclick="setFilter('all')" class="active-filter">All</button>
      <button onclick="setFilter('active')">Active</button>
      <button onclick="setFilter('completed')">Done</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let filter = 'all';

    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();

      if (!text) return;

      tasks.push({
        id: Date.now(),
        text,
        completed: false
      });

      input.value = '';
      saveTasks();
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    function setFilter(type) {
      filter = type;
      document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active-filter'));
      event.target.classList.add('active-filter');
      renderTasks();
    }

    function getFilteredTasks() {
      if (filter === 'active') return tasks.filter(t => !t.completed);
      if (filter === 'completed') return tasks.filter(t => t.completed);
      return tasks;
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      getFilteredTasks().forEach(task => {
        const li = document.createElement('li');
        if (task.completed) li.classList.add('completed');

        li.innerHTML = `
          <span onclick="toggleTask(${task.id})">${task.text}</span>
          <div class="actions">
            <button onclick="toggleTask(${task.id})">✔</button>
            <button class="delete" onclick="deleteTask(${task.id})">✖</button>
          </div>
        `;

        list.appendChild(li);
      });
    }

    renderTasks();
  </script>
</body>
</html>
